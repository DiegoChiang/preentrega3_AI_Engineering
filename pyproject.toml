[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "incident-intelligence-system"
version = "0.3.0"
description = "Sistema RAG local asíncrono con ChromaDB, LCEL y Pydantic."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Diego Chiang Meléndez" }]
dependencies = [
  "anthropic>=0.75,<2",
  "chromadb>=1.0,<2",
  "langchain-anthropic>=1.0,<2",
  "langchain-chroma>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "truststore>=0.10,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
rag-local = "incident_intelligence.cli.rag_local:main"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_intelligence"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore:'asyncio.iscoroutinefunction'.*:DeprecationWarning:chromadb.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

